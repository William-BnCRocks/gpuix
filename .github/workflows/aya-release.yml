# Builds the @gpuix/* packages from this fork and attaches `npm pack` tarballs
# to a GitHub Release. See AYA-FORK.md.
#
# Runs only on a fork (never in remorses/gpuix) and never on main. It uses the
# built-in GITHUB_TOKEN and no other secret. Nothing here writes to an npm
# registry.
name: aya-release
"on":
  workflow_dispatch:
    inputs:
      suffix:
        description: "Release number N: the version becomes <upstream version>-aya.N"
        required: true
        type: string
      macos:
        description: "Also build aarch64-apple-darwin"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "aya-v*"

concurrency:
  group: aya-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  APP_NAME: gpuix-native
  MACOSX_DEPLOYMENT_TARGET: "10.13"

jobs:
  # Works out the version, the tag and the build matrix.
  plan:
    name: plan
    if: github.repository_owner != 'remorses' && (github.event_name == 'push' || github.ref == 'refs/heads/aya')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Plan
        id: plan
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SUFFIX: ${{ inputs.suffix }}
          WITH_MACOS: ${{ inputs.macos || vars.AYA_RELEASE_MACOS }}
        run: |
          set -euo pipefail
          base=$(node -p "require('./packages/native/package.json').version")
          if [ "$EVENT" = "push" ]; then
            tag="$REF_NAME"
            version="${tag#aya-v}"
          else
            if ! [[ "$SUFFIX" =~ ^(0|[1-9][0-9]*)$ ]]; then
              echo "suffix must be a number without leading zeros, got '$SUFFIX'" >&2
              exit 1
            fi
            version="${base}-aya.${SUFFIX}"
            tag="aya-v${version}"
          fi
          number="${version#"${base}-aya."}"
          if [ "$number" = "$version" ] || ! [[ "$number" =~ ^(0|[1-9][0-9]*)$ ]]; then
            echo "version '$version' must look like ${base}-aya.N" >&2
            exit 1
          fi
          # `build` names a script in packages/native/package.json. The default
          # script compiles TestGpuixRenderer. Linux uses build:release, as
          # ci.yml does, because that renderer is a macOS and Windows feature.
          matrix=$(node -e '
            const include = [
              { host: "windows-latest", target: "x86_64-pc-windows-msvc", platform: "win32-x64-msvc", build: "bun run build", renderer: true },
              { host: "ubuntu-latest", target: "x86_64-unknown-linux-gnu", platform: "linux-x64-gnu", build: "bun run build:release", renderer: false },
            ];
            if (process.env.WITH_MACOS === "true") {
              include.push({ host: "macos-latest", target: "aarch64-apple-darwin", platform: "darwin-arm64", build: "bun run build", renderer: true });
            }
            console.log(JSON.stringify({ include }));
          ')
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "matrix=$matrix"
          } >> "$GITHUB_OUTPUT"
          echo "Release $tag ($version)"

  build:
    name: build - ${{ matrix.target }}
    needs: plan
    if: github.repository_owner != 'remorses' && (github.event_name == 'push' || github.ref == 'refs/heads/aya')
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: packages/native
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Reads the channel from rust-toolchain.toml.
      - name: Install Rust
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          target: ${{ matrix.target }}
          cache: false
          rustflags: ""

      - name: Install Metal toolchain
        if: contains(matrix.target, 'apple-darwin')
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/native/target/
          key: ${{ matrix.target }}-cargo-${{ hashFiles('packages/native/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target }}-cargo-

      # Linux system deps for GPUI (Vulkan, Wayland, X11, fonts), as in ci.yml.
      - name: Install Linux dependencies
        if: contains(matrix.target, 'linux')
        working-directory: .
        run: |
          sudo apt-get update && sudo apt-get install -y \
            gcc g++ clang \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            vulkan-validationlayers

      - name: Install dependencies
        working-directory: .
        run: bun install

      # The target must reach napi, not the final tsc command in the build script.
      - name: Build native
        run: ${{ matrix.build }}
        shell: bash
        env:
          CARGO_BUILD_TARGET: ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aya-bindings-${{ matrix.target }}
          path: packages/native/${{ env.APP_NAME }}.*.node
          if-no-files-found: error

  # Collects the bindings, sets the version and packs every package.
  pack:
    name: pack
    needs:
      - plan
      - build
    if: github.repository_owner != 'remorses' && (github.event_name == 'push' || github.ref == 'refs/heads/aya')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install

      - name: Download native artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: aya-bindings-*
          path: packages/native/artifacts

      # `napi artifacts` fails when a configured target has no binary, so list
      # only the targets this run built.
      - name: Narrow napi targets to this run
        working-directory: packages/native
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
        run: node ../../.github/aya/narrow-targets.mjs

      - name: Create npm dirs and move artifacts
        working-directory: packages/native
        run: |
          bunx @napi-rs/cli create-npm-dirs
          bunx @napi-rs/cli artifacts

      # The packages ship the compiled TypeScript in `dist`.
      - name: Build TypeScript
        run: |
          (cd packages/native && bun run build:js)
          (cd packages/react && bun run build)
          (cd packages/solid && bun run build)

      - name: Set versions
        run: node .github/aya/prepare-packages.mjs "$VERSION"

      - name: Pack
        run: |
          set -euo pipefail
          mkdir -p aya-dist
          for dir in packages/native packages/native/npm/* packages/react packages/solid; do
            [ -f "$dir/package.json" ] || continue
            (cd "$dir" && npm pack --pack-destination "$GITHUB_WORKSPACE/aya-dist")
          done
          ls -l aya-dist

      - name: Upload tarballs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aya-tarballs
          path: aya-dist/*.tgz
          if-no-files-found: error

  # Installs the tarballs into an empty project on each OS and loads them.
  smoke:
    name: smoke - ${{ matrix.target }}
    needs:
      - plan
      - pack
    if: github.repository_owner != 'remorses' && (github.event_name == 'push' || github.ref == 'refs/heads/aya')
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.host }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      RENDERER_FLAG: ${{ matrix.renderer && '--expect-test-renderer' || '' }}
    steps:
      # Only for the helper scripts. The smoke project below does not use this tree.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # Libraries the Linux binding loads at run time.
      - name: Install Linux dependencies
        if: contains(matrix.target, 'linux')
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1

      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aya-tarballs
          path: ${{ runner.temp }}/smoke

      - name: Install the tarballs
        shell: bash
        working-directory: ${{ runner.temp }}/smoke
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/.github/aya/write-smoke-package.mjs" "$VERSION"
          cat package.json
          npm install --no-audit --no-fund
          ls node_modules/@gpuix
          test -d "node_modules/@gpuix/native-$PLATFORM"

      - name: Load the packages with Node
        shell: bash
        working-directory: ${{ runner.temp }}/smoke
        run: |
          cp "$GITHUB_WORKSPACE/.github/aya/smoke.mjs" .
          node smoke.mjs "$VERSION" --load-only $RENDERER_FLAG

      - name: Load the packages and run the test renderer with Bun
        shell: bash
        working-directory: ${{ runner.temp }}/smoke
        run: bun smoke.mjs "$VERSION" $RENDERER_FLAG

  release:
    name: release
    needs:
      - plan
      - smoke
    if: github.repository_owner != 'remorses' && (github.event_name == 'push' || github.ref == 'refs/heads/aya')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - name: Download tarballs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: aya-tarballs
          path: aya-dist

      - name: Checksums
        working-directory: aya-dist
        run: |
          sha256sum -- *.tgz > SHA256SUMS
          cat SHA256SUMS

      # Fails when the release already exists. Delete it or pick a new N.
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" aya-dist/*.tgz aya-dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes "@gpuix packages ${VERSION}, built from ${GITHUB_SHA}. Install the tarballs by URL; see AYA-FORK.md."
